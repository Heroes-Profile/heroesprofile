# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions

name: CI

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v3
      with:
        path: /tmp/composer-cache
        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

    - uses: php-actions/composer@v6
      with:
        php_extensions: bcmath

    - run: vendor/bin/pint --test --verbose --ansi app

    # The public API's routes, fixtures and specification have to agree with each
    # other. Both commands below fail rather than warn, because every way they can
    # disagree is silent at runtime: a missing fixture serves live data to an
    # account that should be getting examples, and a registry row with no route is
    # an endpoint the pricing table sells and the API answers 404 for.
    #
    # Neither needs a database. api:check-fixtures skips its registry half with a
    # warning when it cannot reach one, and still enforces route-to-fixture.
    - name: Prepare the application
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Every routed endpoint has a fixture
      run: php artisan api:check-fixtures

    - name: The API specification builds
      run: php artisan api:build-spec --check

    # The committed document is what the docs site and any generated client read,
    # and nothing regenerates it on deploy. Building it here and failing on a diff
    # makes every change to the public surface show up in the pull request that
    # caused it, rather than whenever someone next remembers to run the command.
    - name: The committed API specification is up to date
      run: |
        php artisan api:build-spec
        if ! git diff --quiet public/spec/heroesprofile-v1.json; then
          echo "::error::public/spec/heroesprofile-v1.json is stale. Run 'php artisan api:build-spec' and commit the result."
          git diff --stat public/spec/heroesprofile-v1.json
          exit 1
        fi
