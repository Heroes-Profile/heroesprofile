<VirtualHost *:8000>
  DocumentRoot /var/www/html

  LimitRequestFieldSize 16384
  LimitRequestLine 16384

  # Stock deflate.conf leaves JSON and SVG out.
  AddOutputFilterByType DEFLATE application/json image/svg+xml

  # Temporary: shows what Accept-Encoding reaches Apache.
  SetEnvIf Accept-Encoding "^(.*)$" ORIGIN_AE=$1
  Header always set X-Origin-Accept-Encoding "%{ORIGIN_AE}e"

  # Without a Cache-Control, Cloudflare drops these after a few hours and every
  # data center refetches them. Vite hashes build filenames, so a change is a new URL.
  <Directory /var/www/html/build/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </Directory>

  <Directory /var/www/html/images>
    Header set Cache-Control "public, max-age=86400, s-maxage=2592000"
  </Directory>
</VirtualHost>