<VirtualHost *:8000>
  DocumentRoot /var/www/html
  ServerName www.heroesprofile.com

  LimitRequestFieldSize 16384
  LimitRequestLine 16384

  # Stock deflate.conf leaves JSON out, so API responses left GCP uncompressed.
  AddOutputFilterByType DEFLATE application/json
</VirtualHost>

<VirtualHost *:8000>
  ServerName heroesprofile.com
  Redirect permanent / https://www.heroesprofile.com/
</VirtualHost>
