<VirtualHost *:8000>
  DocumentRoot /var/www/html

  LimitRequestFieldSize 16384
  LimitRequestLine 16384

  # Inside a VirtualHost this replaces the stock deflate.conf list rather than
  # adding to it, so the stock types are repeated here alongside JSON and SVG.
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml

  # Without a Cache-Control, Cloudflare drops these after a few hours and every
  # data center refetches them. Vite hashes build filenames, so a change is a new URL.
  <Directory /var/www/html/build/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </Directory>

  <Directory /var/www/html/images>
    Header set Cache-Control "public, max-age=86400, s-maxage=2592000"
  </Directory>
</VirtualHost>