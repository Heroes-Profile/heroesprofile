<VirtualHost *:8000>
  DocumentRoot /var/www/html
  ServerName www.heroesprofile.com

  LimitRequestFieldSize 16384
  LimitRequestLine 16384

  # Stock deflate.conf leaves JSON out, so API responses left GCP uncompressed.
  # Same for text/javascript (Apache's type for .js) and SVG.
  AddOutputFilterByType DEFLATE application/json text/javascript image/svg+xml

  # Without a Cache-Control, Cloudflare drops these after a few hours and every
  # data center refetches them. Vite hashes build filenames, so a change is a new URL.
  <Directory /var/www/html/build/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </Directory>

  <Directory /var/www/html/images>
    Header set Cache-Control "public, max-age=86400, s-maxage=2592000"
  </Directory>
</VirtualHost>

<VirtualHost *:8000>
  ServerName heroesprofile.com
  Redirect permanent / https://www.heroesprofile.com/
</VirtualHost>
